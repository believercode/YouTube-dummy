<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <button class="theme-toggle" onclick="toggleTheme()">
            <i class="fas fa-moon"></i>
        </button>
        
        <div class="content-wrapper">
            <div class="search-container">
                <input type="text" id="cityInput" placeholder="Enter city name..." autocomplete="off">
                <button onclick="getWeather()">
                    <i class="fas fa-search"></i>
                </button>
            </div>

            <div id="weatherCard" class="weather-card" style="display: none;">
                <div class="weather-header">
                    <h2 class="city-name"></h2>
                    <img class="weather-icon" src="" alt="Weather icon">
                </div>
                
                <div class="temperature">
                    <span class="temp-c"></span>°C
                    <span class="temp-f"></span>
                </div>
                
                <div class="description"></div>
                
                <div class="details">
                    <p><i class="fas fa-thermometer-half"></i> Feels like: <span class="feels-like"></span>°C</p>
                    <p><i class="fas fa-tint"></i> Humidity: <span class="humidity"></span>%</p>
                    <p><i class="fas fa-wind"></i> Wind: <span class="wind"></span> m/s</p>
                </div>

                <div class="forecast-container" id="forecast"></div>
            </div>

            <div id="loading" class="loading" style="display: none;">
                <i class="fas fa-spinner fa-spin"></i> Loading...
            </div>
        </div>
    </div>

    <script>
        // Theme handling
        function toggleTheme() {
            const html = document.documentElement;
            const themeToggle = document.querySelector('.theme-toggle i');
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            // Remove old icon class and add new one with animation
            themeToggle.className = newTheme === 'light' 
                ? 'fas fa-moon' 
                : 'fas fa-sun';
            
            // Update theme
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        // Load saved theme
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            const html = document.documentElement;
            const themeToggle = document.querySelector('.theme-toggle i');
            
            html.setAttribute('data-theme', savedTheme);
            themeToggle.className = savedTheme === 'light' 
                ? 'fas fa-moon' 
                : 'fas fa-sun';
        }

        // Load saved theme on page load
        document.addEventListener('DOMContentLoaded', loadTheme);

        let weatherData = null;

        async function getWeather() {
            const cityInput = document.getElementById('cityInput');
            const city = cityInput.value.trim();
            
            if (!city) {
                showAlert('Please enter a city name');
                return;
            }

            showLoading(true);
            try {
                const response = await fetch(`/weather?city=${encodeURIComponent(city)}`);
                const data = await response.json();

                if (data.error) {
                    showAlert(data.error);
                    return;
                }

                weatherData = data;
                displayWeather(data);
            } catch (error) {
                showAlert('Failed to fetch weather data. Please try again.');
            } finally {
                showLoading(false);
            }
        }

        function displayWeather(data) {
            const weatherCard = document.getElementById('weatherCard');
            weatherCard.style.display = 'block';

            // Current weather
            document.querySelector('.city-name').textContent = data.city;
            const mainIcon = document.querySelector('.weather-icon');
            mainIcon.src = `https://openweathermap.org/img/wn/${data.icon}@2x.png`;
            mainIcon.onerror = function() {
                this.src = 'https://openweathermap.org/img/wn/02d@2x.png'; // Default icon if loading fails
            };
            
            document.querySelector('.temp-c').textContent = Math.round(data.temp);
            document.querySelector('.temp-f').textContent = `(${Math.round(data.temp * 9/5 + 32)}°F)`;
            document.querySelector('.description').textContent = data.description;
            document.querySelector('.feels-like').textContent = Math.round(data.feels_like);
            document.querySelector('.humidity').textContent = data.humidity;
            document.querySelector('.wind').textContent = data.wind_speed;

            // Forecast
            const forecastContainer = document.getElementById('forecast');
            forecastContainer.innerHTML = '';

            data.forecast.forEach(day => {
                const forecastItem = document.createElement('div');
                forecastItem.className = 'forecast-item';
                forecastItem.innerHTML = `
                    <div class="forecast-date">${formatDate(day.date)}</div>
                    <img class="forecast-icon" src="https://openweathermap.org/img/wn/${day.icon}.png" 
                         onerror="this.src='https://openweathermap.org/img/wn/02d.png'"
                         alt="Weather icon">
                    <div class="forecast-temp">${day.temp}°C</div>
                    <div class="forecast-desc">${day.description}</div>
                `;
                forecastContainer.appendChild(forecastItem);
            });

            showLoading(false);
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        }

        function showAlert(message) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.style.display = 'block';
            document.getElementById('weatherCard').style.display = 'none';
            
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        // Handle Enter key
        document.getElementById('cityInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                getWeather();
            }
        });

        // Get user's location
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async position => {
                showLoading(true);
                try {
                    const response = await fetch(`/weather?lat=${position.coords.latitude}&lon=${position.coords.longitude}`);
                    const data = await response.json();
                    
                    if (!data.error) {
                        weatherData = data;
                        displayWeather(data);
                    }
                } catch (error) {
                    console.error('Error getting weather by location:', error);
                } finally {
                    showLoading(false);
                }
            }, error => {
                console.error('Error getting location:', error);
            });
        }
    </script>
</body>
</html>
