<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="panel">
        <header class="header">
            <h1>Free Fire Dashboard</h1>
        </header>
        
        <section class="stats">
            <h2>Player Stats</h2>
            <div class="stats-info">
                <p>Player Name: <span id="player-name">b4d</span></p>
                <p>Kills: <span id="kills">13</span></p>
                <p>Matches Played: <span id="matches">1</span></p>
                <p>Headshots: <span id="headshots">13</span></p>
            </div>
        </section>
        
        <section class="leaderboard">
            <h2>Leaderboard</h2>
            <ul id="leaderboard-list">
                <li>Loading...</li>
            </ul>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
