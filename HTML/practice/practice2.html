<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UX/UI Portfolio</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Bootstrap CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Parent section: Relative to contain absolute children */
        .portfolio-section {
            position: relative;
            background: linear-gradient(to right, #729fe1, #f3c6d3);
            padding: 50px;
            border-radius: 30px;
            width: 800px;
            height: 600px;
            margin: auto;
            overflow: hidden;
        }

        /* Social icons container: Positioned absolutely */
        .social-icons {
            position: absolute;
            top: 50%;
            /* Align to the middle */
            right: 20px;
            /* Offset from the right */
            transform: translateY(-50%);
            /* Center vertically */
            display: flex;
            flex-direction: column;
            gap: 15px;
            /* Spacing between icons */
        }

        .social-icon {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            color: white;
            font-size: 30px;
        }

        .linkedin {
            background-color: #0077B5;
        }

        .behance {
            background-color: #191919;
        }

        .instagram {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }

        .facebook {
            background-color: #3b5998;
        }
    </style>
</head>

<body>

    <div class="portfolio-section">
        <h1>Hi, I’m Freelance <br> <strong>UX/UI Designer</strong></h1>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Felis elit quisque eget pretium varius mi turpis
            malesuada.</p>
        <button class="btn btn-danger">Hire Me</button>

        <!-- Social Icons (Absolute) -->
        <div class="social-icons">
            <div class="social-icon linkedin">
                <i class="fab fa-linkedin-in"></i>
            </div>
            <div class="social-icon behance">
                <i class="fab fa-behance"></i>
            </div>
            <div class="social-icon instagram">
                <i class="fab fa-instagram"></i>
            </div>
            <div class="social-icon facebook">
                <i class="fab fa-facebook-f"></i>
            </div>
        </div>
    </div>

    <!-- Optional JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>

</html>
